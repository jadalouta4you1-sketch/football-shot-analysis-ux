<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1020" viewBox="0 0 1200 1020"><rect width="1200" height="1020" fill="#fafafa"/><g font-family="Arial,sans-serif" fill="#181818"><text x="30" y="42" font-size="29">Match review   /   low-fidelity flow</text><text x="30" y="92" font-size="18">01  Choose match</text><rect x="30" y="104" width="398" height="245" rx="4" fill="white" stroke="#777"/><text x="51" y="142" font-size="18">Choose a match</text><text x="51" y="184" font-size="15">Opponent and date</text><text x="51" y="226" font-size="15">Northside  /  14 November</text><rect x="44" y="245" width="359" height="33" rx="4" fill="#eee" stroke="#777"/><text x="51" y="268" font-size="15">Compare shooting zones</text><text x="457" y="92" font-size="18">02  Compare desktop</text><rect x="457" y="104" width="398" height="245" rx="4" fill="white" stroke="#777"/><text x="478" y="142" font-size="18">Compare shooting zones</text><text x="478" y="184" font-size="15">Zone      Shots      Goals      Rate</text><text x="478" y="226" font-size="15">Inside       10            2           20%</text><text x="478" y="268" font-size="15">Outside      2            1           50%</text><rect x="471" y="287" width="359" height="33" rx="4" fill="#eee" stroke="#777"/><text x="478" y="310" font-size="15">Which zone will you review?</text><text x="30" y="397" font-size="18">03  Review</text><rect x="30" y="409" width="398" height="245" rx="4" fill="white" stroke="#777"/><text x="51" y="447" font-size="18">Review selection</text><text x="51" y="489" font-size="15">Northside  /  14 November</text><text x="51" y="531" font-size="15">Outside the box  /  1 goal from 2</text><text x="51" y="573" font-size="15">Optional review note</text><rect x="44" y="592" width="359" height="33" rx="4" fill="#eee" stroke="#777"/><text x="51" y="615" font-size="15">Save for video review</text><text x="457" y="397" font-size="18">04  Receipt</text><rect x="457" y="409" width="398" height="245" rx="4" fill="white" stroke="#777"/><text x="478" y="447" font-size="18">Saved for video review</text><text x="478" y="489" font-size="15">Northside  /  Outside the box</text><rect x="471" y="508" width="359" height="33" rx="4" fill="#eee" stroke="#777"/><text x="478" y="531" font-size="15">Back to comparison</text><text x="30" y="702" font-size="18">Exception  /  unavailable</text><rect x="30" y="714" width="398" height="245" rx="4" fill="white" stroke="#777"/><text x="51" y="752" font-size="18">Match data unavailable</text><rect x="44" y="771" width="359" height="33" rx="4" fill="#eee" stroke="#777"/><text x="51" y="794" font-size="15">Choose another match</text><text x="457" y="702" font-size="18">Exception  /  empty zone</text><rect x="457" y="714" width="398" height="245" rx="4" fill="white" stroke="#777"/><text x="478" y="752" font-size="18">Outside the box</text><text x="478" y="794" font-size="15">0 attempts  /  rate undefined</text><rect x="471" y="813" width="359" height="33" rx="4" fill="#eee" stroke="#777"/><text x="478" y="836" font-size="15">Select a zone with attempts</text><text x="893" y="90" font-size="18">02  /  Mobile comparison</text><rect x="893" y="103" width="278" height="650" rx="4" fill="white" stroke="#777"/><text x="914" y="144" font-size="16">Compare shooting zones</text><text x="914" y="199" font-size="16">Northside  /  14 Nov</text><rect x="905" y="232" width="250" height="36" rx="4" fill="#eee" stroke="#777"/><text x="914" y="254" font-size="16">Shots    Goals    Rate</text><text x="914" y="309" font-size="16">10           2           20%</text><text x="914" y="364" font-size="16"> 2            1           50%</text><rect x="905" y="397" width="250" height="36" rx="4" fill="#eee" stroke="#777"/><text x="914" y="419" font-size="16">Shot locations</text><text x="914" y="474" font-size="16">Goal ●     Miss ○</text><text x="914" y="529" font-size="16">Choose a zone</text><rect x="905" y="562" width="250" height="36" rx="4" fill="#eee" stroke="#777"/><text x="914" y="584" font-size="16">Review selection</text><text x="892" y="792" font-size="19">Layout rules</text><text x="892" y="825" font-size="15">Desktop: table beside pitch.</text><text x="892" y="853" font-size="15">Mobile: table before pitch.</text><text x="892" y="881" font-size="15">Receipt repeats match and zone.</text></g></svg>