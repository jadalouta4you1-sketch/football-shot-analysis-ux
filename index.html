<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Shot review · Match desk</title>
<style>
:root{--ink:#16332b;--action:#075b45;--muted:#435c53;--surface:#fff;--line:#bbc9c1;--focus:#9a3b00}*{box-sizing:border-box}body{margin:0;background:#f1f4ee;color:var(--ink);font:17px/1.55 system-ui,sans-serif}header{background:var(--ink);color:white;padding:16px max(5vw,24px);font-weight:700;letter-spacing:.04em}main{max-width:980px;margin:5vh auto;padding:24px}h1{font-size:clamp(2rem,6vw,3.6rem);line-height:1.05;margin:.25em 0}h2{font-size:1.3rem}small{color:var(--muted)}section,.panel{background:white;padding:clamp(16px,3vw,32px);margin:16px 0;border:1px solid var(--line);border-radius:12px}button,input,select{font:inherit;padding:10px 14px;border:1px solid var(--action);border-radius:6px;max-width:100%}button{cursor:pointer;background:var(--action);color:white;margin:6px 6px 0 0}button.secondary{color:var(--action);background:white}button:disabled{background:#e2e8e2;color:#54655b;border-color:#9caba0;cursor:default}:focus-visible{outline:3px solid var(--focus);outline-offset:3px}table{width:100%;border-collapse:collapse}th,td{text-align:left;border-bottom:1px solid var(--line);padding:8px 3px}label{display:block;margin:10px 0}.cols{display:grid;grid-template-columns:1fr 1fr;gap:24px}svg{width:100%;height:auto}fieldset{border:0;padding:0}legend{font-weight:700}[hidden]{display:none!important}@media(max-width:700px){main{padding:14px}.cols{grid-template-columns:1fr}th,td{font-size:15px}}
</style><header>Match desk &nbsp; / &nbsp; Video review</header><main id="app"></main>
<script>
const fixtures=[['Northside · 14 Nov',[[10,2],[2,1]]],['Riverside · 17 Nov',[[3,1],[9,2]]],['Westfield · 19 Nov',[[0,0],[4,1]]],['Eastgate · 20 Nov',[[4,1],[8,2]]],['Hillview · 21 Nov',null]];
const zones=['Inside the box','Outside the box'];let match=0,zone=-1,view='both',saved='';
const app=document.getElementById('app');
function title(t){return '<small>University XI &nbsp;·&nbsp; Illustrative match data</small><h1 tabindex="-1">'+t+'</h1>'}
function show(html){app.innerHTML=html;app.querySelector('h1').focus()}
function home(){show(title('Choose a match')+'<section><label for="match">Opponent and match date</label><select id="match">'+fixtures.map(([name],i)=>'<option value="'+i+'" '+(i===match?'selected':'')+'>'+name+'</option>').join('')+'</select><p><button id="open">Compare shooting zones</button></p></section>');document.querySelector('#open').onclick=()=>{match=Number(document.querySelector('#match').value);zone=-1;compare()}}
function pitch(d){let circles='';d.forEach(([n,g],z)=>{for(let i=0;i<n;i++){let x=z?30+(i%3)*15:119+(i%3)*16,y=18+Math.floor(i/3)*17;circles+='<circle cx="'+x+'" cy="'+y+'" r="4" stroke="#16332b" stroke-width="2" fill="'+(i<g?'#16332b':'white')+'"/>'}});return '<svg role="img" aria-label="Schematic locations of illustrative shots, counts given in the adjacent table" viewBox="0 0 180 92"><rect x="2" y="2" width="176" height="88" fill="#e7efe6" stroke="#527268"/><rect x="109" y="8" width="69" height="76" fill="none" stroke="#527268"/>'+circles+'</svg><small>● Goal &nbsp; ○ Attempt without a goal<br>Attacking right · illustrative positions</small>'}
function compare(){const [name,d]=fixtures[match];let html=title('Compare shooting zones')+'<p>'+name+'</p>';if(!d){show(html+'<section><h2>Match data unavailable</h2><p>Choose another match to compare its zones.</p><button onclick="home()">Choose a match</button></section>');return}
const tied=d[0][0]&&d[1][0]&&d[0][1]*d[1][0]===d[1][1]*d[0][0];show(html+'<label for="layout">Comparison layout</label><select id="layout"><option value="both">Table and shot map</option><option value="table">Table only</option></select><section class="cols"><div><h2>Goals and attempts</h2><table><thead><tr><th>Zone</th><th>Shots</th><th>Goals</th><th>Rate</th></tr></thead><tbody>'+d.map(([n,g],i)=>'<tr><th scope="row">'+zones[i]+'</th><td>'+n+'</td><td>'+g+'</td><td>'+(n?Math.round(100*g/n)+'%':'—')+'</td></tr>').join('')+'</tbody></table><p>'+(tied?'Equal conversion rates. Compare the attempt counts.':d.some(([n])=>!n)?'No attempts in one zone. Its rate is undefined.':'Read each rate alongside its attempt count.')+'</p></div><div id="map"><h2>Shot locations</h2>'+pitch(d)+'</div></section><section><fieldset><legend>Which zone will you review on video?</legend>'+zones.map((s,i)=>'<label><input type="radio" name="zone" value="'+i+'" '+(zone===i?'checked':'')+' '+(!d[i][0]?'disabled':'')+'> '+s+'</label>').join('')+'</fieldset><button id="review" '+(zone<0?'disabled':'')+'>Review selection</button><button class="secondary" onclick="home()">Change match</button></section>');
const layout=document.querySelector('#layout'),map=document.querySelector('#map');layout.value=view;map.hidden=view==='table';layout.onchange=()=>{view=layout.value;map.hidden=view==='table'};app.querySelectorAll('[name=zone]').forEach(el=>el.onchange=()=>{zone=Number(el.value);document.querySelector('#review').disabled=false});document.querySelector('#review').onclick=review}
function review(){let [n,g]=fixtures[match][1][zone];show(title('Review selection')+'<section><small>'+fixtures[match][0]+'</small><h2>'+zones[zone]+'</h2><p>'+g+' goals from '+n+' attempts. Save this candidate for the video session.</p><label for="note">Review note (optional, 80 characters maximum)</label><input id="note" aria-describedby="err"><p id="err" role="alert"></p><button id="save">Save for video review</button><button class="secondary" onclick="compare()">Back to comparison</button></section>');document.querySelector('#save').onclick=()=>{let note=document.querySelector('#note');if(note.value.length>80){note.setAttribute('aria-invalid','true');document.querySelector('#err').textContent='Shorten the note to 80 characters or fewer.';note.focus();return}saved=note.value;show(title('Saved for video review')+'<section><h2>'+zones[zone]+'</h2><p>'+fixtures[match][0]+' · Saved for this demo session.</p><p id="savedNote"></p><button onclick="compare()">Back to comparison</button></section>');document.querySelector('#savedNote').textContent=saved}}
home()
</script></html>
